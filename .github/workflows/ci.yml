name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:        # reused by the release workflow

jobs:
  build:
    name: Build every package, Lua tests, client plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Test
        run: for t in tests/*_test.lua; do echo "== $t"; lua5.3 "$t" || exit 1; done
      - name: Build (every package, no muddler or Java)
        run: python3 tools/build.py
      - name: CKMud client plugins (build and test)
        run: |
          sudo apt-get install -y lua5.1
          for dir in packages/*/*-plugin; do
            pkg=$(basename "$(dirname "$dir")"); xml="dist/$(echo "$pkg" | tr 'A-Z' 'a-z').xml"
            node tools/plugin/build-plugin.cjs -o "$xml" "$dir/head.lua" "dist/$pkg.mpackage" "$dir/tail.lua"
            (cd "$dir" && lua5.1 test.lua "$GITHUB_WORKSPACE/$xml") || exit 1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mpackage-all
          path: |
            dist/*.mpackage
            dist/*.xml

  simulate:
    name: ${{ matrix.package }} (lint + simulation)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [Autolearn, Chores, KaiokenTrain, Score, Buffs, Chat, Health]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint manifests
        run: python3 tools/lint_manifests.py packages/${{ matrix.package }}/src
      - name: Simulation tests
        if: hashFiles(format('packages/{0}/tests/runner.js', matrix.package)) != ''
        working-directory: packages/${{ matrix.package }}/tests
        run: npm install --no-audit --no-fund && node runner.js driver.lua
